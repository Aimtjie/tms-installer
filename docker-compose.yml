# Single-host docker-compose for the Ticket Management System.
# Intended for local evaluation / development — see README "This compose stack
# is not a production deployment" for why. Production uses the k8s/ overlays.
#
# Usage:
#   cp .env.example .env       # then replace every CHANGE_ME / blank value
#                              # (JWT_SECRET, BLIND_INDEX_SECRET, POSTGRES_PASSWORD,
#                              # KEYCLOAK_ADMIN_PASSWORD at minimum)
#   docker compose up -d       # pulls the pre-built GHCR images
#
# `--build` rebuilds only the API from source; the web image is always pulled from
# GHCR (its in-repo Dockerfile is a packaging step needing a pre-published dir — see
# the web service below and README "from source"). #1093
#
# Web UI:        http://localhost:${WEB_HTTP_PORT:-8081}
# API:           http://localhost:${API_HTTP_PORT:-8080}
# Keycloak:      http://localhost:${KEYCLOAK_HTTP_PORT:-8090}  (admin / ${KEYCLOAK_ADMIN_PASSWORD})
#
# Services bind to 127.0.0.1 by default (not reachable from other machines).
# For LAN access set BIND_ADDRESS=0.0.0.0 and the *_PUBLIC_BASE_URL variables
# in .env — see the "LAN access" section in .env.example.
#
# First run: open the Web UI — it redirects to the /setup wizard to create your
# admin account. (Demo logins only exist when DEMO_SEEDER_ENABLED=true in .env:
# admin@tms.local / Admin@1234.)
#
# Database files are stored in Docker-managed named volumes (see `volumes:` at
# the bottom). They survive `docker compose down` and `docker compose up` cycles.
# Wipe everything (DB + Keycloak users + realm state) with: `docker compose down -v`.

name: tms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # :? causes `docker compose up` to fail immediately if this is unset/empty,
      # before any service initialises persistent state with a bad password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      # Both ticketdb and keycloakdb are created on first boot via the init script
      # below — Postgres' POSTGRES_DB only supports a single database.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Wait until the /docker-entrypoint-initdb.d init script has actually created
      # both databases: connecting to ticketdb proves it exists, and the pg_database
      # row proves keycloakdb does. (pg_isready only pings the server — it reported
      # healthy even when the init script had failed and neither database existed,
      # letting keycloak crash-loop on "keycloakdb does not exist" with postgres
      # shown green.) -h forces TCP so the check can't pass against the socket-only
      # temporary server the entrypoint runs during first-boot init; PGPASSWORD is
      # a no-op on the default trust config but keeps the check working if local
      # auth is hardened via POSTGRES_INITDB_ARGS. $$ defers to container env.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d ticketdb -tAc \"SELECT 1 FROM pg_database WHERE datname='keycloakdb'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Pinned to the same 26.5.6 digest used by Aspire AppHost.cs — version drift
    # between local-compose and the prod realm has caused real bugs (#370).
    # Verify on bump: `docker buildx imagetools inspect quay.io/keycloak/keycloak:<tag>`.
    image: quay.io/keycloak/keycloak:26.5.6@sha256:8d44614c74798322c4e07fbe0ecb15cfbb5879d69b484628555f58ade06f0d8c
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required — set it in .env}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./ticket-management-system.AppHost/Realms:/opt/keycloak/data/import:ro
    ports:
      # Deliberately NOT governed by BIND_ADDRESS: the app never needs browser →
      # Keycloak traffic (login is Direct Grant proxied by the API), so the admin
      # console stays loopback-only even when the app is exposed on the LAN. Set
      # KEYCLOAK_BIND_ADDRESS=0.0.0.0 only for Entra SSO redirects or remote
      # console access — see the LAN access section in .env.example.
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_HTTP_PORT:-8090}:8080"
    healthcheck:
      # Keycloak 26 exposes /health/ready on the management port (9000) when
      # KC_HEALTH_ENABLED=true. The image has no curl/wget, but does ship bash —
      # so we open a TCP socket via bash's /dev/tcp builtin and look for "UP".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  apiservice:
    # Pre-built image from GHCR (public — no login required).
    # `docker compose up` pulls this automatically.
    # `docker compose up --build` rebuilds the API from source (requires the full repo).
    image: ghcr.io/aimtjie/tms-api:latest
    build:
      context: .
      dockerfile: ticket-management-system.ApiService/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Production mode by default (#1084): reference data (roles, permissions, lookup
      # tables, Keycloak realm roles) seeds in every environment, and the first-run
      # /setup wizard creates your admin account — no hardcoded demo credentials.
      # Set DEMO_SEEDER_ENABLED=true in .env for demo tenants + logins
      # (admin@tms.local / Admin@1234), or ASPNETCORE_ENVIRONMENT=Development for a
      # dev-style stack (relaxed fail-fast guards, human-readable console logs).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # This stack is plain HTTP end-to-end (no TLS terminator), so HTTPS-only Secure
      # cookies would 500 the /setup first-run (see SecurityConfig). Set
      # REQUIRE_HTTPS=true only when a TLS-terminating reverse proxy fronts the stack
      # (recommended for anything beyond evaluation).
      Security__RequireHttps: ${REQUIRE_HTTPS:-false}
      DemoSeeder__Enabled: ${DEMO_SEEDER_ENABLED:-false}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ticketdb: "Host=postgres;Port=5432;Database=ticketdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}"
      Keycloak__BaseUrl: http://keycloak:8080
      # Public-facing Keycloak URL — rendered into per-tenant SSO setup instructions
      # (ClientDetail.razor "Microsoft Entra Redirect URI"). The API fail-fast guard
      # at Program.cs:288 requires this when ASPNETCORE_ENVIRONMENT != Development.
      Keycloak__PublicBaseUrl: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:8090}
      Keycloak__Realm: tms
      Keycloak__ClientId: tms-api
      Keycloak__AdminUsername: ${KEYCLOAK_ADMIN_USER:-admin}
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required — set it in .env}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required — set it in .env (openssl rand -base64 48)}
      Jwt__Issuer: tms-api
      Jwt__Audience: tms-web
      Jwt__ExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"
      Encryption__BlindIndexSecret: ${BLIND_INDEX_SECRET:?BLIND_INDEX_SECRET is required — set it in .env (openssl rand -base64 48)}
      Tickets__NumberPrefix: ${TICKET_NUMBER_PREFIX:-SS}
      # Loopback origins are appended so browsing from the host itself (localhost
      # or 127.0.0.1) keeps working in Production mode even after WEB_PUBLIC_BASE_URL
      # is repointed at a LAN IP — Production CORS and the /setup origin check are
      # exact-match, unlike Development which always allowed loopback. The appended
      # origins track WEB_HTTP_PORT so a custom web port stays reachable from the host.
      Cors__WebOrigin: "${WEB_PUBLIC_BASE_URL:-http://localhost:8081},http://localhost:${WEB_HTTP_PORT:-8081},http://127.0.0.1:${WEB_HTTP_PORT:-8081}"
      Sso__WebRedirectBaseUrl: ${WEB_PUBLIC_BASE_URL:-http://localhost:8081}
      # No reverse proxy in this stack: trust forwarded headers from loopback only.
      # Without this, Production mode would trust all RFC1918 peers (TrustedProxies
      # #997 default for in-cluster proxies), letting LAN clients spoof
      # X-Forwarded-For and bypass the per-IP login rate limiter (#608). If you add
      # a TLS proxy, set TRUSTED_PROXY_CIDR to where its traffic enters the app
      # container (the Docker network CIDR for an in-network proxy, not its public
      # address) — see the TRUSTED_PROXY_CIDR notes in .env.example.
      RateLimiting__TrustedProxyCidrs__0: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      Migrations__AutoReconcileSquash: "true"
      # Optional: if BWS_ACCESS_TOKEN + BWS_ORGANIZATION_ID are set in .env, the
      # Bitwarden Secrets Manager provider takes precedence over the values above.
      BWS_ACCESS_TOKEN: ${BWS_ACCESS_TOKEN:-}
      BWS_ORGANIZATION_ID: ${BWS_ORGANIZATION_ID:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_HTTP_PORT:-8080}:8080"
    # /Logs is where the Serilog Development file sink writes (../Logs/ from /app).
    # tmpfs keeps it memory-backed and ephemeral — no host path needed.
    tmpfs:
      - /Logs
    healthcheck:
      # The aspnet runtime image ships neither curl nor wget, so we probe via
      # bash's /dev/tcp builtin. `head -1` keeps just the HTTP status line; a
      # 200 means the /health checks all passed (ASP.NET Core returns 503 with
      # body "Unhealthy" otherwise).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    # GHCR-only image (public — no login required). Unlike apiservice there is no `build:`:
    # ticket-management-system.Web/Dockerfile is a packaging Dockerfile that expects an
    # already-published directory — the blazor.web.js targeting-pack gotcha forces `dotnet
    # publish` OUTSIDE Docker (see CLAUDE.md "Static Web Assets"), and an in-Docker build
    # would silently ship a broken WASM UI. Build web from source via the two-step in
    # README ("from source"), not `docker compose --build`. #1093
    image: ghcr.io/aimtjie/tms-web:latest
    restart: unless-stopped
    depends_on:
      apiservice:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Same plain-HTTP posture as apiservice — see the comment there.
      Security__RequireHttps: ${REQUIRE_HTTPS:-false}
      # Cloudflare Web Analytics is opt-in (#1095): the image no longer ships a token, so
      # self-hosted stacks report nothing by default. Set CLOUDFLARE_ANALYTICS_TOKEN in .env
      # to send page views to YOUR OWN Cloudflare zone.
      CloudflareAnalytics__Token: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
      # Same loopback-only forwarded-header trust as apiservice (no proxy here).
      RateLimiting__TrustedProxyCidrs__0: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      ASPNETCORE_URLS: http://+:8080
      # Same Postgres — Web only reads/writes the DataProtectionKeys table.
      ConnectionStrings__ticketdb: "Host=postgres;Port=5432;Database=ticketdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}"
      # Server-side (Blazor Server / SignalR) — pod-to-pod via the Docker network.
      services__apiservice__http__0: http://apiservice:8080
      # Browser-facing — returned to the WASM client via /bff/api-config. Must be
      # an origin the user's browser can resolve, hence host port, not service name.
      ApiService__BaseUrl: ${API_PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_HTTP_PORT:-8081}:8080"
    tmpfs:
      - /Logs
    healthcheck:
      # See apiservice healthcheck for rationale.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  # Docker prefixes managed volume names with the compose project name
  # (`name: tms` at the top of this file), so the final names visible to
  # `docker volume ls` are `tms_postgres_data` and `tms_keycloak_data`.
  # Stored under /var/lib/docker/volumes/ on the host.
  # To use a bind mount instead (DB files visible in your working dir),
  # replace the empty driver block with:
  #   postgres_data:
  #     driver: local
  #     driver_opts:
  #       type: none
  #       device: ${PWD}/data/postgres
  #       o: bind
  postgres_data:
  keycloak_data:
