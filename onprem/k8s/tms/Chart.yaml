apiVersion: v2
name: tms
description: >-
  Ticket Management System — API, Web and Keycloak for a Kubernetes cluster you
  already run, against a PostgreSQL server you already operate.
type: application

# Chart version. Bumped independently of the application.
version: 0.2.0

# Application version. Stamped by scripts/build-onprem-release.sh at packaging
# time; the value committed here is only meaningful for a source checkout.
appVersion: "0.0.0-dev"

# 1.27 is the floor for the resources this chart uses as written. The optional
# ValidatingAdmissionPolicy in vap-api-replicas.yaml needs 1.30+, which is
# checked separately where it is rendered rather than raising the floor for
# everyone — that template is off by default.
kubeVersion: ">=1.27.0-0"

# No dependencies, deliberately.
#
# Keycloak is deployed from a Deployment in this chart rather than the upstream
# or Bitnami chart. Three things about how TMS uses it are load-bearing and a
# general-purpose chart does not express them: the /auth path prefix must match
# what the API is told to call server-to-server (#1217/#1178), --import-realm
# must be in args or Keycloak starts healthy with no realm at all (#1236), and
# the image is digest-pinned because a floating tag broke this once (#370).
#
# PostgreSQL is yours. This chart never installs a database.

home: https://github.com/Aimtjie/tms-installer
keywords:
  - itsm
  - ticketing
  - helpdesk
annotations:
  # Surfaced by `helm show chart`. The first is the one that gets missed.
  tms.io/attachments-are-not-backed-up: >-
    With the default attachments.provider=local, attachments live on a
    PersistentVolumeClaim and nothing in this chart backs them up — confirm your
    platform snapshots the StorageClass you choose. attachments.provider=postgres
    stores them in your database instead, where your database backup covers them.
  tms.io/api-is-single-replica: >-
    tms-api runs exactly one replica until leader election lands (TMS #1173
    Track 2). Scaling it sends duplicate report emails to customers and can
    corrupt an in-flight import.
