# Source: tms/templates/pvc-attachments.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tms-attachments
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Survive `helm uninstall`.
    #
    # Helm deletes PVCs it created. Every file anyone has ever attached to a
    # ticket is on this volume, and NOTHING IN THIS CHART BACKS IT UP — so an
    # uninstall would be the only deletion, with no second copy anywhere.
    #
    # The cost of keeping it is an orphaned PVC after a deliberate teardown,
    # which is visible and reversible. Removing it manually is documented in
    # docs/UNINSTALL.md.
    #
    # The same annotation covers an upgrade that switches attachments.provider
    # from `local` to `postgres`. This object then stops rendering, and Helm's
    # rule for a resource that leaves the manifest set is to delete it — except
    # when it carries this annotation, which makes it skip the delete. So the
    # claim and its volume are RETAINED rather than removed: no longer tracked
    # by the release, still holding every file, and still there if you switch
    # back. Nothing here copies those files into the database; moving them is a
    # migration you do deliberately.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    # Sufficient while tms-api runs a single replica, which is the only
    # supported configuration today. If that changes, this must become
    # ReadWriteMany or move to object storage — a second API pod on another node
    # cannot mount a ReadWriteOnce volume.
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: "REPLACE-ME"
