# Source: tms/templates/keycloak.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app: tms-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tms-keycloak
  strategy:
    # Keycloak imports its realm at startup against a shared database.
    # Overlapping an old and a new instance during a rollout risks both touching
    # the schema at once, so replace rather than overlap.
    type: Recreate
  template:
    metadata:
      labels:
        helm.sh/chart: tms-0.2.0
        app.kubernetes.io/name: tms
        app.kubernetes.io/instance: tms
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        app: tms-keycloak
      annotations:
        # Keycloak reads the realm ONLY at startup. Without this annotation a
        # realm change updates the ConfigMap, the mounted file changes, and
        # nothing re-reads it — the edit appears to have been applied and has
        # not been.
        checksum/realm: 842a0c3c5ab290e65c1fcffad98d053d1e92a6c9cabb8b9ca753a090e988a6b4
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        
        - name: postgres-ca
          secret:
            secretName: tms-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak@sha256:8d44614c74798322c4e07fbe0ecb15cfbb5879d69b484628555f58ade06f0d8c
          imagePullPolicy: IfNotPresent
          # `start` without --optimized: the stock image has not been built for
          # this database configuration, so it performs the build step on first
          # boot. That is slow, which is what the generous startupProbe is for.
          args:
            - start
            # --import-realm is what actually reads the realm mounted at
            # /opt/keycloak/data/import. WITHOUT IT Keycloak starts perfectly
            # happily, serves /health/ready, and has no tms realm — so the API's
            # first admin call 404s, reference-data seeding throws, and tms-api
            # crash-loops while every other pod reports healthy. Keycloak skips
            # the import when the realm already exists, so this is safe on every
            # restart, not just the first. (TMS #1236.)
            - --import-realm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # Served under a path on the shared hostname, so the whole system
            # needs one DNS record and one certificate.
            #
            # This value and Keycloak__BaseUrl in the tms-config ConfigMap are
            # rendered from the SAME helper. They must agree: the API's admin and
            # token calls are server-to-server and never pass through the
            # ingress, so nothing adds the prefix for them.
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            # Pin the management interface to the root explicitly. Whether it
            # would otherwise inherit KC_HTTP_RELATIVE_PATH is version-dependent,
            # and the probes below must not be guesswork.
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: "/"
            - name: KC_HOSTNAME
              value: "https://tickets.example.internal/auth"
            # TLS terminates at the ingress; Keycloak speaks plain HTTP inside
            # the cluster and trusts the forwarded headers.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_DB
              value: postgres
            # Same server and same TLS posture as the API's connection string,
            # rendered from the same values through tms.pg.jdbc — the two are
            # written in different languages and would otherwise drift.
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres.example.internal:5432/keycloakdb?sslmode=verify-full&sslrootcert=/etc/postgres-tls/ca.crt"
            - name: KC_DB_USERNAME
              value: "tms"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Postgres__Password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminUsername
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminPassword
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            
            - name: postgres-ca
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # First boot runs the build step and imports the realm, which on a
          # modest node takes minutes. 40 x 15s = 10 minutes before liveness can
          # fire.
          startupProbe:
