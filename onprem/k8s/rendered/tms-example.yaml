            # What the BROWSER is told to call. The same origin as the web app
            # itself, because the ingress path-routes /api to the API service —
            # so the WASM client's /bff/api-config returns a same-origin base and
            # no cross-origin request is ever made.
            - name: ApiService__BaseUrl
              value: https://tickets.example.internal
            - name: SignalR__Transport
              value: WebSockets
