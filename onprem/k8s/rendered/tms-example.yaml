# Source: tms/templates/ingress.yaml
# Single-origin ingress.
#
# Everything lives under ONE hostname on different paths:
#
#   /api/    /odata/                    ->  tms-api
#   /auth/  ->  keycloak
#   /                                   ->  tms-web
#
# One DNS record, one certificate, and — because the browser only ever talks to
# one origin — no CORS configuration to get wrong. The WASM client asks the web
# host for its API base address and is told "same origin as you", so a
# cross-origin request never happens.
#
# The alternative, a second hostname for Keycloak, costs another DNS record,
# another name on the certificate, and brings CORS back.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tms
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 160m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "tickets.example.internal"
      secretName: tms-tls
  rules:
    - host: "tickets.example.internal"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tms-api
                port:
                  number: 80
          - path: /odata
            pathType: Prefix
            backend:
              service:
                name: tms-api
                port:
                  number: 80
          # Always rendered. _validate.tpl refuses a root relativePath, so this is
          # always a real prefix. An earlier version guarded this block, so a
          # relativePath of "/" produced an ingress with NO route to sign-in and
          # nothing reported a problem.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tms-web
                port:
                  number: 80
---
# Source: tms/templates/ingress.yaml
# Sticky routes, split into their own object because they need cookie affinity
# and the routes above must NOT have it.
#
# Two independent reasons this is required, not optional:
#
# 1. The web app uses InteractiveAutoRenderMode. The FIRST visit runs as a real
#    Blazor Server circuit over /_blazor, and a circuit lives in one pod's
#    memory. The Redis backplane does not make circuits portable — nothing does.
#
# 2. The notification hub sets AllowStatefulReconnects, which buffers
#    per-connection state in pod memory. The backplane does not replicate that
#    buffer either, so a reconnect landing on a different pod silently loses it.
#
# Affinity is deliberately absent from /api: those requests are stateless and
# pinning them would concentrate load for no benefit. It is configured even on a
# single-replica install, where it is inert — so that scaling up is a
# replica-count change and not a debugging session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tms-sticky
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/proxy-body-size: 160m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/session-cookie-name: tms-affinity
    nginx.ingress.kubernetes.io/session-cookie-path: /
    nginx.ingress.kubernetes.io/session-cookie-samesite: Lax
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "tickets.example.internal"
      secretName: tms-tls
  rules:
    - host: "tickets.example.internal"
      http:
        paths:
          # SignalR notification hub — served by the API.
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: tms-api
                port:
                  number: 80
          # Blazor Server circuit — served by the web host.
          - path: /_blazor
            pathType: Prefix
            backend:
              service:
                name: tms-web
                port:
                  number: 80
---
# Source: tms/templates/job-preflight.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: tms-preflight
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Runs BEFORE anything else is created or updated, and blocks the release if
    # it fails.
    #
    # Without it, a wrong database detail presents as the API, Web and Keycloak
    # pods all crash-looping at once, with the real cause several hundred lines
    # into whichever log you happen to open first. Every check below maps to a
    # specific thing an operator gets wrong on a first install.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Kept on failure so the logs can be read; removed once it passes.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        helm.sh/chart: tms-0.2.0
        app.kubernetes.io/name: tms
        app.kubernetes.io/instance: tms
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        app: tms-preflight
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      volumes:
        
        - name: postgres-ca
          secret:
            secretName: tms-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      containers:
        - name: preflight
          image: ghcr.io/cloudnative-pg/postgresql:17.6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
              value: "postgres.example.internal"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "tms"
            - name: PGSSLMODE
              value: "verify-full"
            - name: PGSSLROOTCERT
              value: /etc/postgres-tls/ca.crt
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Postgres__Password
            - name: TMS_APP_DB
              value: "ticketdb"
            - name: TMS_KC_DB
              value: "keycloakdb"
            - name: TMS_KC_USER
              value: "tms"
          volumeMounts:
            
            - name: postgres-ca
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              fail() {
                  echo ''
                  echo "PREFLIGHT FAILED: $1"
                  echo ''
                  echo "$2"
                  echo ''
                  exit 1
              }

              echo "Checking ${PGHOST}:${PGPORT} as ${PGUSER} (sslmode=${PGSSLMODE})"

              # 1. Reachable at all. Separates "wrong hostname" and "blocked by a
              #    NetworkPolicy" from "wrong password", which look identical
              #    once you are only reading application logs.
              #    Deliberately probed with sslmode=prefer rather than the configured
              #    mode. pg_isready honours PGSSLMODE, so under `require` against a
              #    server with TLS switched off it fails - and attributing THAT to
              #    reachability sends an operator hunting for NetworkPolicies and DNS
              #    when the actual fix is one line of postgresql.conf. Caught on a real
              #    cluster; the two are now reported separately because they have
              #    nothing to do with each other.
              if ! PGSSLMODE=prefer pg_isready -q -t 10; then
                  fail "cannot reach PostgreSQL at ${PGHOST}:${PGPORT}" \
              "Check, in this order:
                * the hostname resolves from inside this cluster
                * the port is correct and the server is listening on it
                * no NetworkPolicy in this namespace blocks egress to it — a
                  default-deny policy is the single most common cause, and it is
                  invisible from the database's side"
              fi
              echo "  reachable"

              # 2. TLS available. Asked separately now that we know the port answers,
              #    so a failure here can only be about TLS.
              case "$PGSSLMODE" in
                  disable|prefer|allow) ;;
                  *)
                      if ! pg_isready -q -t 10; then
                          fail "${PGHOST}:${PGPORT} is reachable but refused a TLS connection" \
              "postgres.sslMode is '${PGSSLMODE}', and the server answered on the port but would
              not negotiate TLS. That is a server-side setting, not a network problem:

                * check ssl = on in postgresql.conf, and that the server can read its
                  certificate and key
                * check pg_hba.conf offers a hostssl line matching this client

              Or, if this database is genuinely not meant to use TLS, say so explicitly
              with postgres.sslMode=disable rather than leaving a setting that claims a
              protection you do not have."
                      fi
                      echo "  TLS accepted (${PGSSLMODE})"
                      ;;
              esac

              # 3. The application database, with the application role.
              if ! psql -d "$TMS_APP_DB" -tAc 'SELECT 1' >/dev/null 2>/tmp/err; then
                  fail "cannot connect to database '${TMS_APP_DB}' as '${PGUSER}'" \
              "$(cat /tmp/err)

              Expected setup:
                CREATE ROLE ${PGUSER} LOGIN PASSWORD '...';
                CREATE DATABASE ${TMS_APP_DB} OWNER ${PGUSER};"
              fi
              echo "  ${TMS_APP_DB} reachable as ${PGUSER}"

              # 4. Keycloak's database. A separate database on the same server,
              #    and the check most often missed — Keycloak is the component
              #    that fails, so nobody looks at the database list.
              TMS_KC_REPORTED_USER=$PGUSER
              if [ -n "${TMS_KC_PASSWORD:-}" ]; then
                  TMS_KC_REPORTED_USER=$TMS_KC_USER
                  PGPASSWORD="$TMS_KC_PASSWORD" psql -U "$TMS_KC_USER" -d "$TMS_KC_DB" -tAc 'SELECT 1' \
                      >/dev/null 2>/tmp/err \
                      || fail "cannot connect to database '${TMS_KC_DB}' as '${TMS_KC_USER}'" \
              "$(cat /tmp/err)

              Keycloak is configured with its own role. Expected setup:
                CREATE ROLE ${TMS_KC_USER} LOGIN PASSWORD '...';
                CREATE DATABASE ${TMS_KC_DB} OWNER ${TMS_KC_USER};"
              else
                  psql -d "$TMS_KC_DB" -tAc 'SELECT 1' >/dev/null 2>/tmp/err \
                      || fail "cannot connect to database '${TMS_KC_DB}' as '${PGUSER}'" \
              "$(cat /tmp/err)

              Keycloak keeps its own schema in its own database on the same
              server, and shares this role. Expected setup:
                CREATE DATABASE ${TMS_KC_DB} OWNER ${PGUSER};

              If your policy requires a separate role for the identity store,
              set postgres.keycloak.username and postgres.keycloak.existingSecret
              instead."
              fi
              echo "  ${TMS_KC_DB} reachable as ${TMS_KC_REPORTED_USER}"

              # 5. TLS actually negotiated.
              #
              #    Asked of the SERVER rather than inferred from the client
              #    setting, because 'require' asks for encryption without
              #    verifying anything and a misconfigured server can still leave
              #    you unencrypted. Reading pg_stat_ssl for our own backend is
              #    the only answer that is not a guess.
              if [ "$PGSSLMODE" != "disable" ]; then
                  ssl=$(psql -d "$TMS_APP_DB" -tAc \
                      'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' 2>/dev/null || echo '?')
                  if [ "$ssl" != "t" ]; then
                      fail "connected to '${TMS_APP_DB}' WITHOUT TLS, but postgres.sslMode is '${PGSSLMODE}'" \
              "The server reported ssl='${ssl}' for this connection.

              Either the server is not configured for TLS, or its pg_hba.conf is
              matching a non-SSL rule for this client. Fix the server, or set
              postgres.sslMode=disable to state plainly that this deployment
              talks to its database in clear text."
                  fi
                  echo "  TLS negotiated (${PGSSLMODE})"
              else
                  echo "  TLS not requested (sslMode=disable)"
              fi

              echo ''
              echo 'Preflight passed.'
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
