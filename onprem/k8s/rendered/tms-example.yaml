            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
        
        - name: postgres-ca
          secret:
            secretName: tms-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: web
