# Source: tms/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-api
  labels:
    helm.sh/chart: tms-0.2.0
    app.kubernetes.io/name: tms
    app.kubernetes.io/instance: tms
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app: tms-api
spec:
  # Exactly one. Anything else is refused at install — see _validate.tpl for the
  # five background services that have no leader election.
  replicas: 1
  # Recreate, not the default RollingUpdate.
  #
  # This is load-bearing and easy to miss. With `replicas: 1` and the DEFAULT
  # strategy, maxSurge is 25%, which rounds UP to 1 — so a second API pod runs
  # alongside the old one during every single update. For the whole overlap
  # window there are two report schedulers, two mailbox pollers, two SLA
  # monitors, two import-recovery sweeps and two concurrent EF migrations. The
  # replica count says one; the rollout gives you two.
  #
  # Recreate accepts a few seconds of downtime instead. On a single-replica
  # deployment that is not a real loss: a rolling update of one pod already ends
  # with a restart the user sees. (TMS #1758.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tms-api
  template:
    metadata:
      labels:
        helm.sh/chart: tms-0.2.0
        app.kubernetes.io/name: tms
        app.kubernetes.io/instance: tms
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        app: tms-api
      annotations:
        # Roll the pod when non-secret configuration changes. Without this a
        # ConfigMap edit is applied to the volume but never read, because these
        # values are consumed as environment variables at process start.
        checksum/config: 24c7403b920443cb9a6c4137d1d7ac05e5740c08220669df62e4f71a9d542fc6
    spec:
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
        # Only the local provider has anything to mount. Under `postgres` no
        # claim is created, and a volume naming a claim that does not exist
        # leaves this pod Pending instead of reporting anything.
        - name: attachments
          persistentVolumeClaim:
            claimName: tms-attachments
        
        - name: postgres-ca
          secret:
            secretName: tms-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: api
          image: ghcr.io/aimtjie/tms-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tms-config
          env:
            # ── Database ────────────────────────────────────────────
            # The password is injected as its own variable and referenced by
            # $(TMS_DB_PASSWORD) in the connection string below. Kubernetes
            # expands $(VAR) using variables declared EARLIER in this list, so
            # the order here matters.
            #
            # Doing it this way means the password never passes through Helm.
            # Helm records every rendered manifest — Secret contents included —
            # in a Secret in this namespace, and keeps one per retained
            # revision. A password interpolated at render time would live there
            # for the life of the release.
            - name: TMS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Postgres__Password
            - name: ConnectionStrings__ticketdb
              value: "Host=postgres.example.internal;Port=5432;Database=ticketdb;Username=tms;Password=$(TMS_DB_PASSWORD);Ssl Mode=VerifyFull;Root Certificate=/etc/postgres-tls/ca.crt"

            # ── Signing and encryption ──────────────────────────────
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Jwt__Secret
            # Immutable once data exists. Changing it makes every user
            # unfindable and sign-in stops working, with no migration path.
            - name: Encryption__BlindIndexSecret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Encryption__BlindIndexSecret

            # ── Keycloak admin ──────────────────────────────────────
            - name: Keycloak__AdminUsername
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminUsername
            - name: Keycloak__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminPassword

            # Only needed for Microsoft Entra sign-in. Absent otherwise, and the
            # API logs that it is skipping SSO client setup rather than failing.
            - name: Sso__Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Sso__Keycloak__ClientSecret
                  optional: true
            # ── SignalR backplane ───────────────────────────────────
            # Same $(VAR) indirection as the database password.
            - name: TMS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Redis__Password
            - name: ConnectionStrings__redis
              value: "redis:6379,password=$(TMS_REDIS_PASSWORD)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: attachments
              mountPath: /var/tms/attachments
            
            - name: postgres-ca
              mountPath: /etc/postgres-tls
              readOnly: true
          # startupProbe holds liveness and readiness off until boot finishes.
          # First boot runs migrations and warms every tenant's encryption key,
          # which on a modest node takes minutes — without this the liveness
          # probe kills the pod mid-migration and it never converges.
          # 40 x 15s = 10 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 40
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
