# TMS single-domain reverse proxy (nginx) — #1182.
#
# Terminates TLS and routes ONE hostname by path:
#   /api/, /odata/   -> API
#   /hubs/           -> API (SignalR, WebSocket)
#   /_blazor         -> Web (Blazor Server circuit, WebSocket)
#   /auth/realms/    -> Keycloak   (sign-in — the ONLY Keycloak paths exposed)
#   /auth/resources/ -> Keycloak   (login theme assets)
#   /auth/...        -> 403         (admin console + metrics stay internal)
#   /                -> Web
#
# Mounted at /etc/nginx/conf.d/tms.conf (http context), so the `map` below is valid here.
#
# Upstreams are resolved at request time via Docker's embedded DNS (127.0.0.11)
# so restarting an app container does not leave nginx holding a stale IP. Using a
# variable in proxy_pass forces that runtime resolution; $request_uri carries the
# original path through unchanged (no rewrite).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health probe for the compose healthcheck — never redirected.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Everything else goes to HTTPS.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Docker embedded DNS — required for the runtime resolution below.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Blazor WASM can upload attachments; keep this in step with the API's limit.
    client_max_body_size 160m;

    # Forwarded headers: the app trusts these (Security__RequireHttps + TrustedProxies)
    # to engage HSTS + Secure cookies and to rate-limit by the real client IP.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # WebSocket upgrade is declared here at SERVER scope, not per-location. nginx
    # REPLACES the inherited proxy_set_header set the moment a location declares its
    # own — so setting Upgrade inside /hubs or /_blazor would silently drop every
    # forwarded header above (X-Forwarded-Proto, -For, Host), and the app would see
    # the SignalR/Blazor connection as plain HTTP from the proxy's own IP. Declared
    # once here, every location inherits the full set (for non-WS requests
    # $http_upgrade is empty and Connection maps to "close").
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- API ---
    location /api/ {
        set $tms_api apiservice;
        proxy_pass http://$tms_api:8080$request_uri;
    }

    location /odata/ {
        set $tms_api apiservice;
        proxy_pass http://$tms_api:8080$request_uri;
    }

    # --- SignalR (WebSocket) ---
    location /hubs/ {
        set $tms_api apiservice;
        proxy_pass http://$tms_api:8080$request_uri;
        # No proxy_set_header here — inherit the full forwarded + upgrade set above.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --- Blazor Server circuit (WebSocket, first interactive visit) ---
    # Regex so it matches the bare hub path /_blazor (WS connects there with ?id=) and
    # /_blazor/negotiate, but NOT an unrelated /_blazorxyz. Regex locations win over the
    # /-catch-all, and still inherit the server-level forwarded + upgrade headers.
    location ~ ^/_blazor(/|$) {
        set $tms_web web;
        proxy_pass http://$tms_web:8080$request_uri;
        # No proxy_set_header here — inherit the full forwarded + upgrade set above.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --- Keycloak: ONLY the sign-in paths are public (tighter admin restriction) ---
    # Longest-prefix match means these win over the /auth/ block below.
    location /auth/realms/ {
        set $tms_kc keycloak;
        proxy_pass http://$tms_kc:8080$request_uri;
    }

    location /auth/resources/ {
        set $tms_kc keycloak;
        proxy_pass http://$tms_kc:8080$request_uri;
    }

    # Admin console (/auth/admin), metrics and everything else under /auth stay
    # internal — reachable only on the Docker network, never via the public domain.
    location /auth/ {
        return 403;
    }

    # --- Web app (catch-all, last) ---
    location / {
        set $tms_web web;
        proxy_pass http://$tms_web:8080$request_uri;
    }
}
