---
apiVersion: v1
kind: Service
metadata:
  name: tms-api
  labels:
    app: tms-api
spec:
  selector:
    app: tms-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-api
  labels:
    app: tms-api
spec:
  # Patched per stage. Note that more than one replica is only safe once the
  # background services take leader election (tracked in #1173) — until then the
  # scheduled-report and mailbox pollers would run on every replica.
  replicas: 1
  strategy:
    # #1758 — replace, never overlap. With no strategy Kubernetes defaults to
    # RollingUpdate with maxSurge 25%, which rounds UP to 1 for a single replica:
    # a second API pod is started and waited on until Ready — up to ten minutes,
    # per the startup probe below — before the first one is stopped.
    #
    # For that whole window there are two of every background service, and none
    # of them takes leader election (#1173 Track 2). Two ReportSchedulerServices
    # send a customer the same scheduled report twice; two
    # RecoverInterruptedBatchesAsync sweeps claim in-flight import batches
    # cluster-wide with no owner, so the starting pod takes over the running
    # pod's import.
    #
    # Recreate costs a short gap during an upgrade. On a single-node install that
    # is the right trade, and it matches keycloak and redis alongside.
    type: Recreate
  selector:
    matchLabels:
      app: tms-api
  template:
    metadata:
      labels:
        app: tms-api
    spec:
      # Images are public on GHCR, so there is no pull secret and nothing that
      # expires. That is deliberate: a credential that needs renewing is a
      # scheduled outage at a site nobody can reach.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
        - name: attachments
          persistentVolumeClaim:
            claimName: tms-attachments
        # CA published by CNPG for verifying the database's TLS certificate.
        - name: postgres-ca
          secret:
            secretName: tms-postgres-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        # DataProtection key-ring encryption certificate (#913). Minted once by
        # bootstrap.sh and escrowed; see onprem/docs/RUNBOOK.md. Never replace it —
        # the ring resolves its decryptor by thumbprint, so a new certificate cannot
        # unwrap what the old one wrote.
        - name: dataprotection-cert
          secret:
            secretName: tms-dataprotection-cert
            # 0440, not 0444: the pods run as UID 1654 with fsGroup 1654, so group
            # read is enough and nothing else needs to see a key-wrapping key.
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
      containers:
        - name: api
          # Digest pinned by the release tarball. A tag would mean a pod restart
          # eight months from now silently pulls whatever main has become.
          image: ghcr.io/aimtjie/tms-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tms-config
          env:
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Jwt__Secret
            - name: Encryption__BlindIndexSecret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Encryption__BlindIndexSecret
            - name: ConnectionStrings__ticketdb
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: ConnectionStrings__ticketdb
            - name: Keycloak__AdminUsername
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminUsername
            - name: Keycloak__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Keycloak__AdminPassword
            # Only needed for Microsoft Entra sign-in; absent otherwise, and the
            # API logs that it is skipping SSO client setup rather than failing.
            - name: Sso__Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Sso__Keycloak__ClientSecret
                  optional: true
            # ── SignalR backplane ─────────────────────────────────────────
            # Composed here rather than stored as its own key in tms-secrets, so
            # the Redis password lives in exactly ONE place: rotating
            # Redis__Password cannot leave a stale copy embedded in a second
            # key that nothing would flag. This is the same $(VAR) indirection
            # the Helm target uses (onprem/k8s/tms/templates/_helpers.tpl), so
            # both on-prem targets now wire Redis identically (#1759).
            #
            # Deliberately NOT optional. redis.yaml reads Redis__Password the
            # same way, so an install missing it has no Redis either — better a
            # pod that will not start than one that silently runs without the
            # backplane it is being charged for. That silence was the defect.
            #
            # ⚠ TMS_REDIS_PASSWORD MUST stay ABOVE ConnectionStrings__redis.
            # Kubernetes expands $(VAR) only from EARLIER entries in the same
            # container's env list, so declared after use the API would try to
            # authenticate with the literal text "$(TMS_REDIS_PASSWORD)" —
            # worse than the absent key this replaced, and just as quiet.
            # Pinned by K3sApi_ReceivesARedisConnectionStringAddressedAtTheRealService.
            - name: TMS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: Redis__Password
            - name: ConnectionStrings__redis
              value: "redis:6379,password=$(TMS_REDIS_PASSWORD)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: attachments
              mountPath: /var/tms/attachments
            - name: postgres-ca
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: dataprotection-cert
              mountPath: /etc/tms-dataprotection
              readOnly: true
          # startupProbe holds liveness and readiness off until boot finishes.
          # First boot runs migrations and warms every tenant's encryption key,
          # which on a small server takes minutes — without this the liveness
          # probe kills the pod mid-migration and it never converges.
          # 40 x 15s = 10 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 40
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tms-attachments
  labels:
    app: tms
spec:
  accessModes:
    - __K8S_STORAGE_ACCESS_MODE__
  resources:
    requests:
      storage: 5Gi
  storageClassName: __K8S_STORAGE_CLASS__
